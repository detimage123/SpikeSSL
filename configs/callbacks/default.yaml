model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.root_dir}/checkpoints/training
  filename: "${model.name}_{epoch:02d}_{val_score:.4f}"
  monitor: "val_score"
  mode: "max"
  save_last: False
  save_top_k: 1

early_stopping:
  _target_: lightning.pytorch.callbacks.EarlyStopping
  monitor: "val_score"
  patience: 15
  mode: "max"
  min_delta: 0.001
